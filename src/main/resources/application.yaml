spring:
  application:
    name: cashpilot-api
    version: "@project.version@"

  datasource:
    url: jdbc:postgresql://localhost:5432/cashpilot_dev
    username: cashpilot_dev
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none

app:
  security:
    authentication:
      password:
        max-failed-attempts: 5
        failure-window: 15m
        lock-duration: 15m
      mfa:
        max-failed-attempts: 5
        failure-window: 15m
        lock-duration: 15m
      ip-rate-limit:
        max-requests: 20
        window: 1m
        key-prefix: "cashpilot:${app.environment}:auth:login:ip"